<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061426">
<title>VOREXA — Ideas Into Impact</title>
<style>
:root{--blue:#1769ff;--navy:#061426;--line:rgba(57,126,255,.45)}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--navy)}body{margin:0;background:var(--navy);font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden}
main{width:100%;max-width:1536px;margin:auto}.screen-link{display:block;position:relative;line-height:0;overflow:hidden;isolation:isolate;scroll-margin-top:0;background:var(--navy)}.screen{display:block;width:100%;height:auto;margin:0;border:0;line-height:0;transition:filter .6s ease;user-select:none;-webkit-user-drag:none}.screen-link:hover>.screen{filter:saturate(1.04)}
/* Interactive hotspots are aligned over controls already visible in the supplied screenshots. */
.hotspot{position:absolute;z-index:4;display:block;line-height:normal;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;transition:background .22s,border-color .22s,box-shadow .22s;outline:none}.hotspot:hover,.hotspot:focus-visible{background:rgba(23,105,255,.12);border-color:rgba(69,143,255,.8);box-shadow:0 0 22px rgba(23,105,255,.35),inset 0 0 12px rgba(23,105,255,.12)}.hotspot:active{background:rgba(23,105,255,.25)}
/* Top navigation and hero calls to action in the first reference image */
#home .nav-home{left:40%;top:1.2%;width:5%;height:2.2%}#home .nav-about{left:45%;top:1.2%;width:5%;height:2.2%}#home .nav-services{left:51%;top:1.2%;width:7%;height:2.2%}#home .nav-portfolio{left:58%;top:1.2%;width:8%;height:2.2%}#home .nav-faq{left:66%;top:1.2%;width:5%;height:2.2%}#home .nav-contact{left:70%;top:1.2%;width:8%;height:2.2%}#home .nav-start{left:78%;top:1%;width:12%;height:3.2%;border-radius:8px}#home .hero-cta{left:43%;top:18.4%;width:13%;height:3.6%;border-radius:7px}#home .work-cta{left:43%;top:32%;width:14%;height:3.3%;border-radius:7px}
/* Article load-more button */
#blog .load-more{left:35%;top:87%;width:30%;height:5.5%;border-radius:20px}
/* FAQ rows and question field */
#faq .faq-one{left:27%;top:11.7%;width:47%;height:5.4%;border-radius:16px}#faq .faq-two{left:27%;top:17.2%;width:47%;height:9.5%;border-radius:16px}#faq .faq-three{left:27%;top:27.9%;width:47%;height:5.4%;border-radius:16px}#faq .faq-four{left:27%;top:33.3%;width:47%;height:5.4%;border-radius:16px}#faq .faq-input{left:28%;top:39.2%;width:45%;height:6.8%;border-radius:12px}#faq .faq-send{left:56%;top:46.6%;width:17%;height:4%;border-radius:22px}
/* Pricing package actions */
#pricing .price-starter{left:56%;top:66%;width:20%;height:3.6%;border-radius:8px}#pricing .price-pro{left:34%;top:66%;width:20%;height:3.6%;border-radius:8px}#pricing .price-custom{left:11%;top:66%;width:20%;height:3.6%;border-radius:8px}#pricing .buy-starter{left:56%;top:71%;width:20%;height:4%;border-radius:8px}#pricing .buy-pro{left:34%;top:71%;width:20%;height:4%;border-radius:8px}#pricing .buy-custom{left:11%;top:71%;width:20%;height:4%;border-radius:8px}
/* Contact form is layered over the matching form area. */
#contact .contact-name{left:47%;top:48.5%;width:20%;height:4.2%}#contact .contact-email{left:70%;top:48.5%;width:20%;height:4.2%}#contact .contact-service{left:47%;top:56.7%;width:43%;height:4.2%}#contact .contact-message{left:47%;top:64%;width:43%;height:10%;resize:none}#contact .contact-submit{left:47%;top:77.8%;width:18%;height:4.5%;border-radius:8px}
.form-hotspot{font:13px Arial,sans-serif;color:#eaf2ff;padding:9px 11px;background:rgba(5,24,49,.04)}.form-hotspot:focus{background:rgba(5,24,49,.84);border-color:#347dff;box-shadow:0 0 20px #1769ff55}.form-hotspot::placeholder{color:transparent}.form-hotspot:focus::placeholder{color:#9db6da}.select-hotspot{color:transparent}.select-hotspot:focus{color:#eaf2ff}.select-hotspot option{background:#061426;color:white}
.note{position:fixed;right:14px;bottom:14px;z-index:9;background:rgba(23,105,255,.92);color:white;padding:11px 15px;border:1px solid #77aaff66;border-radius:30px;font:600 12px Arial;text-decoration:none;box-shadow:0 4px 24px #1769ff55;backdrop-filter:blur(12px);transition:transform .2s,box-shadow .2s}.note:hover{transform:translateY(-3px);box-shadow:0 0 30px #1769ff88}
.toast{position:fixed;left:50%;bottom:18px;z-index:10;transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:calc(100vw - 28px);background:#0b1d35;border:1px solid #2d6bd9;color:#eaf2ff;padding:12px 17px;border-radius:12px;font:13px/1.4 Arial;box-shadow:0 12px 40px #0007;transition:opacity .25s,transform .25s}.toast.show{opacity:1;transform:translate(-50%,0)}


@media(max-width:600px){.screen-link:before{animation-duration:15s}.hotspot:hover{box-shadow:none} .form-hotspot{font-size:10px;padding:5px}.note{right:9px;bottom:9px;padding:9px 12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.screen-link:before{animation:none}.hotspot,.note,.toast{transition:none}}
@media print{.note,.toast{display:none}}
</style>
</head>
<body>
<main>
<section class="screen-link" id="home" aria-label="Vorexa home and process"><img class="screen" src="assets/screen-1.jpg" alt="VOREXA hero, process and portfolio">
<a class="hotspot nav-home" href="#home" aria-label="Home"></a><a class="hotspot nav-about" href="#about" aria-label="About"></a><a class="hotspot nav-services" href="#services" aria-label="Services"></a><a class="hotspot nav-portfolio" href="#portfolio" aria-label="Portfolio"></a><a class="hotspot nav-faq" href="#faq" aria-label="FAQ"></a><a class="hotspot nav-contact" href="#contact" aria-label="Contact us"></a><a class="hotspot nav-start" href="#contact" aria-label="Get started"></a><a class="hotspot hero-cta" href="#portfolio" aria-label="Explore our work"></a><a class="hotspot work-cta" href="#services" aria-label="Explore our services"></a></section>
<section class="screen-link" id="services" aria-label="Services and benefits"><img class="screen" src="assets/screen-6.jpg" alt="VOREXA services and benefits"><span id="about" style="position:absolute;top:0;left:0"></span><span id="portfolio" style="position:absolute;top:0;left:0"></span></section>
<section class="screen-link" id="blog" aria-label="Insights and articles"><img class="screen" src="assets/screen-7.jpg" alt="VOREXA insights and articles"><button class="hotspot load-more" type="button" aria-label="Load more articles" data-toast="You're viewing the articles available in this screenshot. Add article images and content to expand the portfolio."></button></section>
<section class="screen-link" id="testimonials" aria-label="Client testimonials"><img class="screen" src="assets/screen-2.jpg" alt="VOREXA client testimonials"><button class="hotspot" style="left:5%;top:45%;width:8%;height:9%" type="button" aria-label="Previous testimonial" data-toast="This screenshot contains one visible testimonial. Add more testimonials to enable the slider."></button><button class="hotspot" style="right:5%;top:45%;width:8%;height:9%" type="button" aria-label="Next testimonial" data-toast="This screenshot contains one visible testimonial. Add more testimonials to enable the slider."></button></section>
<section class="screen-link" id="faq" aria-label="Frequently asked questions"><img class="screen" src="assets/screen-3.jpg" alt="VOREXA FAQ and footer"><button class="hotspot faq-one" type="button" aria-label="Open FAQ: services" data-faq="VOREXA provides creative design, web development, automation and digital marketing services."></button><button class="hotspot faq-two" type="button" aria-label="Open FAQ: website development" data-faq="Yes. Website and web development projects can be tailored to your business needs, with responsive layouts and clear functionality."></button><button class="hotspot faq-three" type="button" aria-label="Open FAQ: graphic design" data-faq="Yes. Graphic design and branding deliverables can be discussed according to your project scope."></button><button class="hotspot faq-four" type="button" aria-label="Open FAQ: social media" data-faq="Digital marketing and social media support can be scoped around your goals and channels."></button><textarea class="hotspot form-hotspot faq-input" id="faqQuestion" placeholder="Ask us what you want to know…" aria-label="Ask a question"></textarea><button class="hotspot faq-send" type="button" aria-label="Send question" id="faqSend"></button></section>
<section class="screen-link" id="pricing" aria-label="Pricing packages"><img class="screen" src="assets/screen-5.jpg" alt="VOREXA pricing packages"><a class="hotspot price-custom" href="#contact" aria-label="Book a call for custom package"></a><a class="hotspot price-pro" href="#contact" aria-label="Book a call for professional package"></a><a class="hotspot price-starter" href="#contact" aria-label="Book a call for starter package"></a><a class="hotspot buy-custom" href="#contact" aria-label="Ask about custom package"></a><a class="hotspot buy-pro" href="#contact" aria-label="Ask about professional package"></a><a class="hotspot buy-starter" href="#contact" aria-label="Ask about starter package"></a></section>
<section class="screen-link" id="contact" aria-label="Contact VOREXA"><img class="screen" src="assets/screen-4.jpg" alt="VOREXA contact details and message form"><form id="contactForm"><input class="hotspot form-hotspot contact-name" name="name" autocomplete="name" placeholder="Enter your name" aria-label="Full name" required><input class="hotspot form-hotspot contact-email" name="email" type="email" autocomplete="email" placeholder="Enter your email" aria-label="Email address" required><select class="hotspot form-hotspot contact-service select-hotspot" name="service" aria-label="Service required" required><option value="" selected disabled>Select a service</option><option>Website Development</option><option>UI/UX Design</option><option>Graphic Design</option><option>Digital Marketing</option><option>AI Automation</option><option>Other</option></select><textarea class="hotspot form-hotspot contact-message" name="message" placeholder="Tell us about your project…" aria-label="Message" required></textarea><button class="hotspot contact-submit" type="submit" aria-label="Send message"></button></form></section>
</main>
<a class="note" href="#home" aria-label="Back to top">↑ TOP</a><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const toast=document.getElementById('toast');let toastTimer;
function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),3800)}
document.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>notify(el.dataset.toast)));
document.querySelectorAll('[data-faq]').forEach(el=>el.addEventListener('click',()=>notify(el.dataset.faq)));
document.getElementById('faqSend').addEventListener('click',()=>{const q=document.getElementById('faqQuestion').value.trim();if(!q){notify('Please type your question first.');return}location.href='mailto:contact.vorexa.com@gmail.com?subject='+encodeURIComponent('VOREXA website question')+'&body='+encodeURIComponent(q)});
document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const body=`Name: ${f.get('name')}\nEmail: ${f.get('email')}\nService: ${f.get('service')}\n\nProject details:\n${f.get('message')}`;location.href='mailto:contact.vorexa.com@gmail.com?subject='+encodeURIComponent('VOREXA project enquiry')+'&body='+encodeURIComponent(body)});
// Smooth reveal of screenshot panels while preserving the original artwork.
if('IntersectionObserver' in window){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.style.opacity='1';e.target.style.transform='translateY(0)';io.unobserve(e.target)}}),{threshold:.04});document.querySelectorAll('.screen-link').forEach((el,i)=>{if(i>0){el.style.opacity='1';el.style.transform='none'}io.observe(el)})}
</script>
</body></html>
